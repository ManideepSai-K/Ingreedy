name: Pantry demo smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ingreedy .
      - name: Check recipe matching and saved guides
        run: docker run --rm -v "$PWD/backend/test_recipe_search.py:/app/test_recipe_search.py:ro" --entrypoint python ingreedy -m unittest -v test_recipe_search
      - name: Start demo without keys
        run: docker run -d --name pantry -p 8000:8000 ingreedy
      - name: Check frontend and pantry API
        shell: bash
        run: |
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8000/health | jq -e '.recipes > 0'
          curl -fsS http://localhost:8000/ | grep -q 'id="root"'
          curl -fsS http://localhost:8000/api/features | jq -e '.chat == false and .video == false'
          curl -fsS -H 'Content-Type: application/json' -d '{"ingredients":["rice","eggs"],"spices":["butter"]}' http://localhost:8000/api/get-recipes |
            jq -e '(.data[0].title == "Simple egg fried rice") and (.data[0].missedIngredientCount == 0)'
          curl -fsS http://localhost:8000/api/recipes/900000001 | jq -e '(.steps | length > 0) and (.quantities | length > 0)'
      - if: failure()
        run: docker logs pantry || true
